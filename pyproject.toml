[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackout-schedule"
version = "0.1.0"
description = "Автоматический сборник графиков отключений электроэнергии"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
