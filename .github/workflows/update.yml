name: Update schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check update.py
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== UPDATE.PY ==="
          head -30 update.py
          echo "=== FILES ==="
          ls -la

      - name: Run parser
        env:
          YASNO_REGION_ID: "3"
          YASNO_PROVIDER_ID: "301"
        run: python update.py

      - name: Commit schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "Update schedule $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
