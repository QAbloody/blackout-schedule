name: Update schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install browser
        run: playwright install --with-deps chromium

      - name: Run parser
        env:
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          NOTIFY_GROUPS: "3.1,3.2"
        run: python update.py

      - name: Commit schedule.json and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json notify_state.json
          git diff --staged --quiet || git commit -m "Update schedule $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push

      - name: Notify on workflow failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.ALERT_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.ALERT_CHAT_ID }}" \
            -d text="🚨 YASNO PARSER: workflow ${{ github.workflow }} впав на кроці, який не зловив update.py (run: ${{ github.run_id }}). Дивись лог в Actions."
